# Include INSIDE the existing port-80 server block. Do not replace location /.
location = /great_equalizer {
    return 308 https://puls-mp.ru/great_equalizer/;
}
location ^~ /great_equalizer/ {
    return 308 https://puls-mp.ru$request_uri;
}
location ^~ /.well-known/acme-challenge/ {
    root /var/lib/great-equalizer-acme;
    try_files $uri =404;
    access_log off;
}
