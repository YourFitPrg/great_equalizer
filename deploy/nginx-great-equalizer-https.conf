# New file /etc/nginx/sites-available/great-equalizer, separate from wb-analytics.
# Enable only AFTER issuing/checking this certificate and testing nginx -t.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name puls-mp.ru;
    ssl_certificate /etc/letsencrypt/live/puls-mp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puls-mp.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location = /great_equalizer {
        return 308 /great_equalizer/;
    }
    location = /great_equalizer/api/login {
        limit_req zone=ge_login burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/great-equalizer-proxy.conf;
    }
    location = /great_equalizer/api/session {
        limit_req zone=ge_session burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/great-equalizer-proxy.conf;
    }
    location ^~ /great_equalizer/ {
        include /etc/nginx/snippets/great-equalizer-proxy.conf;
    }
    # The existing site continues to use its current HTTP entry and port 8787.
    # Do not add HSTS: it applies to the whole host, not only this project path.
    location / {
        return 302 http://puls-mp.ru$request_uri;
    }
}
